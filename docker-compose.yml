# SAR-Sense 一键编排：MySQL 8 + 应用
#
# 用法：
#   1. 在项目根目录创建 .env，填 DASHSCOPE_API_KEY 和 TAVILY_API_KEY（参考 .env.example）
#   2. docker compose up --build      # 首次需要 build 应用镜像
#   3. 浏览器打开 http://localhost:5000 ，admin / admin123 登录
#   4. 日常启停：docker compose up  /  docker compose down
#
# 首次启动会下载 BGE 重排模型（约 1.1GB，进 hf_cache 卷，之后秒加载）。

services:
  db:
    image: mysql:8.0
    container_name: sar-sense-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sar_sense
    # 强制 utf8mb4，对齐本地开发配置
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 调试时可在宿主机用 DB GUI 连 127.0.0.1:3307（故意避开本地 MySQL 的 3306，避免端口冲突）
    # 不需要可注释掉这两行
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # healthcheck 必须确认 sar_sense 库已建（不只 ping），否则应用启动时建表会失败
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1' sar_sense --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  app:
    build: .
    container_name: sar-sense-app
    ports:
      - "5000:5000"
    environment:
      # MySQL 连接（指向 db 服务，容器间走 docker 网络）
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: sar_sense
      # 重排模型走 HF 下载（容器内无本地 E:/models 路径；HF_ENDPOINT=hf-mirror.com 已在镜像内置）
      RERANKER_MODEL_NAME: BAAI/bge-reranker-base
      # API key 从宿主 .env 读取注入（未设置则传空串，不阻断启动）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/data/uploads      # 用户上传的图片/文件
      - app_logs:/app/logs                  # 日志文件
      - app_runtime:/app/runtime            # BM25 索引缓存
      - hf_cache:/app/.cache/huggingface    # HF 模型缓存（BGE reranker，避免每次重启重下）
    restart: unless-stopped

volumes:
  mysql_data:
  app_uploads:
  app_logs:
  app_runtime:
  hf_cache:
