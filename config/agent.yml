external_data_path: data/external/records.csv
# tavily_api_key 从 .env 的 TAVILY_API_KEY 读取，不在此明文存放

main_agent:
  max_tool_calls: 6
  recursion_limit: 25

research_agent:
  enabled: true
  name: sar-researcher
  max_tool_calls: 6
  recursion_limit: 20

memory:
  enabled: true
  profile_top_k: 5
  semantic_top_k: 5
  score_threshold: 0.3
  max_memories_per_user: 200
  max_ops_per_turn: 3
  inject_char_budget: 800
