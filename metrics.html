  <section class="metrics-page section" style="padding-top: 120px; min-height: 100vh;">
    <div class="container">
      <div class="section-header reveal">
        <h2>Agent 可观测性面板</h2>
        <p>实时监控工具调用、成功率、响应时间等关键指标</p>
      </div>

      <!-- Metrics Cards -->
      <div class="metrics-cards reveal">
        <div class="m-card m-card-blue">
          <div class="m-card-value tabular" id="metricRounds">0</div>
          <div class="m-card-label">对话轮次</div>
        </div>
        <div class="m-card m-card-amber">
          <div class="m-card-value tabular" id="metricToolCalls">0</div>
          <div class="m-card-label">工具调用次数</div>
        </div>
        <div class="m-card m-card-green">
          <div class="m-card-value tabular" id="metricSuccessRate">0%</div>
          <div class="m-card-label">工具调用成功率</div>
        </div>
        <div class="m-card m-card-pink">
          <div class="m-card-value tabular" id="metricAvgCalls">0</div>
          <div class="m-card-label">每轮平均调用</div>
        </div>
      </div>

      <div class="metrics-actions reveal">
        <button class="btn btn-secondary" id="resetBtn">
          <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#refresh-cw"/></svg>
          重置指标
        </button>
      </div>

      <!-- Tabs -->
      <div class="knowledge-container reveal">
        <div class="tabs">
          <button class="tab-btn active" data-tab="tabDistribution">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#activity"/></svg>
            工具调用分布
          </button>
          <button class="tab-btn" data-tab="tabTimeline">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#clipboard-list"/></svg>
            调用时间线
          </button>
          <button class="tab-btn" data-tab="tabDetails">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#scan-search"/></svg>
            工具详情
          </button>
        </div>

        <div class="tab-panels">
          <div class="tab-panel active" id="tabDistribution">
            <div class="chart-wrapper">
              <canvas id="toolChart"></canvas>
            </div>
          </div>

          <div class="tab-panel" id="tabTimeline">
            <div class="timeline-list" id="timelineList"></div>
          </div>

          <div class="tab-panel" id="tabDetails">
            <div id="toolDetailsTable"></div>
            <div id="loopDetection"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
