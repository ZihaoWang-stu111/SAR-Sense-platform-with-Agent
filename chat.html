<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能问答 | SAR-Sense</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/luxury.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a07f4f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='2.4' fill='%23a07f4f'/%3E%3Cpath d='M12 4a8 8 0 0 1 8 8'/%3E%3Cpath d='M12 8a4 4 0 0 1 4 4'/%3E%3Cline x1='12' y1='12' x2='19' y2='5'/%3E%3C/svg%3E">
</head>
<body class="lux-cursor-on">
  <script src="js/luxury.js"></script>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="particles"></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
            <path d="M12 4a8 8 0 0 1 8 8"/>
            <path d="M12 8a4 4 0 0 1 4 4"/>
            <line x1="12" y1="12" x2="19" y2="5"/>
          </svg>
        </span>
        <span>SAR-Sense</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">首页</a></li>
        <li><a href="detection.html">SAR 检测</a></li>
        <li><a href="chat.html" class="active">智能问答</a></li>
        <li><a href="knowledge.html">知识库</a></li>
        <li><a href="metrics.html">可观测性</a></li>
      </ul>
      <div class="navbar-actions">
        <a href="detection.html" class="btn btn-secondary btn-sm">开始检测</a>
      </div>
      <button class="mobile-menu-btn" aria-label="菜单">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#menu"/></svg>
      </button>
    </div>
  </nav>

  <section class="chat section" style="padding-top: 120px; min-height: 100vh;">
    <div class="container">
      <div class="section-header reveal">
        <h2>智能体问答</h2>
        <p>与 AI 助手对话，获取专业的 SAR 分析报告</p>
      </div>

      <div class="chat-layout reveal">
        <div class="chat-sidebar" id="chatSidebar">
          <div class="sidebar-header">
            <button class="btn btn-primary btn-sm" id="newConvBtn">
              <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#plus"/></svg>
              新建对话
            </button>
          </div>
          <div class="conversation-list" id="conversationList"></div>
        </div>

        <div class="chat-main">
          <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
              <div class="message-avatar">
                <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#bot"/></svg>
              </div>
              <div class="message-content">
                <p>你好！我是 SAR-Sense 智能助手。我可以帮你：</p>
                <ul>
                  <li>分析 SAR 图像检测结果</li>
                  <li>查询海洋环境数据</li>
                  <li>检索知识库文档</li>
                  <li>生成专业分析报告</li>
                </ul>
                <p>请问有什么可以帮你的？</p>
              </div>
            </div>
          </div>

          <div class="attachment-indicator" id="attachmentIndicator" style="display: none;">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#paperclip"/></svg>
            <span id="attachmentName">附件已就绪</span>
            <button class="attachment-remove" id="removeAttachment" aria-label="移除附件">
              <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#x"/></svg>
            </button>
          </div>

          <div class="chat-input-area">
            <div class="chat-input-wrapper">
              <button class="btn btn-icon" id="attachBtn" title="上传附件" aria-label="上传附件">
                <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#paperclip"/></svg>
              </button>
              <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.csv,.json,.log,.py" hidden>
              <textarea id="chatInput" placeholder="输入你的问题…" rows="1"></textarea>
              <button class="btn btn-primary" id="sendBtn" aria-label="发送">
                <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#send"/></svg>
              </button>
            </div>
            <div class="chat-hint">
              按 Enter 发送，Shift + Enter 换行 · 支持上传附件
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/chat.js?v=20260618-1"></script>
</body>
</html>
