<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能问答 | SAR-Sense</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="particles"></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span class="logo-icon">🛰️</span>
        <span>SAR-Sense</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">首页</a></li>
        <li><a href="detection.html">SAR检测</a></li>
        <li><a href="chat.html">智能问答</a></li>
        <li><a href="knowledge.html">知识库</a></li>
        <li><a href="metrics.html">可观测性</a></li>
      </ul>
      <div class="navbar-actions">
        <a href="detection.html" class="btn btn-secondary">开始检测</a>
      </div>
      <button class="mobile-menu-btn" aria-label="菜单">☰</button>
    </div>
  </nav>

  <section class="chat section" style="padding-top: 120px; min-height: 100vh;">
    <div class="container">
      <div class="section-header reveal">
        <h2>智能体问答</h2>
        <p>与 AI 助手对话，获取专业的 SAR 分析报告</p>
      </div>

      <div class="chat-layout reveal">
        <div class="chat-sidebar" id="chatSidebar">
          <div class="sidebar-header">
            <button class="btn btn-primary btn-sm" id="newConvBtn">
              <span>+</span> 新建对话
            </button>
          </div>
          <div class="conversation-list" id="conversationList"></div>
        </div>

        <div class="chat-main">
          <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
              <div class="message-avatar">🤖</div>
              <div class="message-content">
                <p>你好！我是 SAR-Sense 智能助手。我可以帮你：</p>
                <ul>
                  <li>分析 SAR 图像检测结果</li>
                  <li>查询海洋环境数据</li>
                  <li>检索知识库文档</li>
                  <li>生成专业分析报告</li>
                </ul>
                <p>请问有什么可以帮你的？</p>
              </div>
            </div>
          </div>

          <div class="attachment-indicator" id="attachmentIndicator" style="display: none;">
            <span class="icon">📎</span>
            <span id="attachmentName">附件已就绪</span>
            <button class="attachment-remove" id="removeAttachment">✕</button>
          </div>

          <div class="chat-input-area">
            <div class="chat-input-wrapper">
              <button class="btn btn-icon" id="attachBtn" title="上传附件">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.csv,.json,.log,.py" hidden>
              <textarea id="chatInput" placeholder="输入你的问题..." rows="1"></textarea>
              <button class="btn btn-primary" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
              </button>
            </div>
            <div class="chat-hint">
              按 Enter 发送，Shift + Enter 换行 · 支持上传附件
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/chat.js"></script>
</body>
</html>
