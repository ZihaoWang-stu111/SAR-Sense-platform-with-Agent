  <section class="knowledge section" style="padding-top: 120px; min-height: 100vh;">
    <div class="container">
      <div class="section-header reveal">
        <h2>知识库管理</h2>
        <p>上传文档、智能分块、向量入库，构建专属知识检索系统</p>
      </div>

      <div class="knowledge-container reveal">
        <div class="tabs">
          <button class="tab-btn active" data-tab="tabUpload">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#file-up"/></svg>
            上传文件
          </button>
          <button class="tab-btn" data-tab="tabFiles">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#clipboard-list"/></svg>
            文件列表
          </button>
          <button class="tab-btn" data-tab="tabUsers" data-admin-only>
            用户角色
          </button>
        </div>

        <div class="tab-panels">
          <!-- Upload Tab -->
          <div class="tab-panel active" id="tabUpload">
            <div class="upload-section">
              <div class="kb-upload-area" id="kbUploadArea">
                <div class="upload-icon">
                  <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#upload-cloud"/></svg>
                </div>
                <h3>上传知识库文件</h3>
                <p>支持 TXT · PDF 格式，拖拽或点击上传</p>
                <input type="file" id="kbFileInput" accept=".txt,.pdf" multiple hidden>
                <button class="btn btn-primary" id="kbUploadBtn">
                  <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#file-up"/></svg>
                  选择文件
                </button>
              </div>

              <div class="selected-files-area" id="selectedFilesArea" style="display: none;">
                <span class="selected-label">
                  <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#paperclip"/></svg>
                  已选择
                </span>
                <span class="selected-names" id="selectedFiles"></span>
              </div>

              <div class="permission-panel" id="permissionPanel">
                <div class="permission-panel-head">
                  <span class="permission-kicker">VISIBILITY</span>
                  <strong>文件权限</strong>
                </div>
                <label class="permission-option">
                  <input type="radio" name="visibilityMode" value="admin_only" checked>
                  <span>仅管理员可见</span>
                </label>
                <label class="permission-option">
                  <input type="radio" name="visibilityMode" value="roles">
                  <span>指定角色可见</span>
                </label>
                <div class="role-checks" id="roleChecks">
                  <label><input type="checkbox" value="researcher"> researcher</label>
                  <label><input type="checkbox" value="business"> business</label>
                  <label><input type="checkbox" value="guest"> guest</label>
                </div>
              </div>

              <div class="status-message" id="uploadStatus" style="display: none;"></div>

              <div class="ingest-area">
                <button class="btn btn-primary btn-lg" id="ingestBtn" disabled>
                  <span class="btn-spinner" style="display: none;">
                    <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#refresh-cw"/></svg>
                  </span>
                  <span class="btn-text">一键入库</span>
                </button>
                <p class="ingest-hint">上传后点击入库，自动分块写入向量数据库</p>
              </div>
            </div>
          </div>

          <!-- Files Tab -->
          <div class="tab-panel" id="tabFiles">
            <div class="files-header">
              <div class="stats-cards">
                <div class="stat-card">
                  <div class="stat-value" id="fileCount">0</div>
                  <div class="stat-label">已入库文档</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value" id="chunkCount">0</div>
                  <div class="stat-label">向量切片</div>
                </div>
                <div class="stat-card stat-card-accent">
                  <div class="stat-value">ChromaDB</div>
                  <div class="stat-label">向量引擎</div>
                </div>
              </div>
            </div>
            <div class="status-message status-info" id="fileListStatus" style="display: none;"></div>
            <div class="file-list" id="fileList"></div>
          </div>

          <div class="tab-panel" id="tabUsers">
            <div class="status-message status-info" id="userListStatus" style="display: none;"></div>
            <div class="file-list" id="userRoleList"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script>
    // 非 admin 用户隐藏上传 tab + 删除按钮（后端已拦截，前端也不露入口）
    if (isLoggedIn() && !isAdmin()) {
      // 隐藏上传 tab 按钮
      document.querySelectorAll('[data-tab="tabUpload"], [data-admin-only]').forEach(el => el.style.display = 'none');
      // 知识库页面自动切换到文件列表 tab
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const listTab = document.querySelector('[data-tab="tabFiles"]');
      const listPanel = document.getElementById('tabFiles');
      if (listTab) listTab.classList.add('active');
      if (listPanel) listPanel.classList.add('active');
    }
  </script>
