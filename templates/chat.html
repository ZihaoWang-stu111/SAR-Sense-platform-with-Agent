  <section class="chat section" style="padding-top: 120px; min-height: 100vh;">
    <div class="container">
      <div class="section-header reveal">
        <h2>智能体问答</h2>
        <p>与 AI 助手对话，获取专业的 SAR 分析报告</p>
      </div>

      <div class="chat-layout reveal">
        <div class="chat-sidebar" id="chatSidebar">
          <div class="sidebar-header">
            <button class="btn btn-primary btn-sm" id="newConvBtn">
              <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#plus"/></svg>
              新建对话
            </button>
          </div>
          <div class="conversation-list" id="conversationList"></div>
        </div>

        <div class="chat-main">
          <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
              <div class="message-avatar">
                <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#bot"/></svg>
              </div>
              <div class="message-content">
                <p>你好！我是 SAR-Sense 智能助手。我可以帮你：</p>
                <ul>
                  <li>分析 SAR 图像检测结果</li>
                  <li>查询海洋环境数据</li>
                  <li>检索知识库文档</li>
                  <li>生成专业分析报告</li>
                </ul>
                <p>请问有什么可以帮你的？</p>
              </div>
            </div>
          </div>

          <div class="attachment-indicator" id="attachmentIndicator" style="display: none;">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#paperclip"/></svg>
            <span id="attachmentName">附件已就绪</span>
            <button class="attachment-remove" id="removeAttachment" aria-label="移除附件">
              <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#x"/></svg>
            </button>
          </div>

          <div class="chat-input-area">
            <div class="chat-input-wrapper">
              <button class="btn btn-icon" id="attachBtn" title="上传附件" aria-label="上传附件">
                <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#paperclip"/></svg>
              </button>
              <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.csv,.json,.log,.py" hidden>
              <textarea id="chatInput" placeholder="输入你的问题…" rows="1"></textarea>
              <button class="btn btn-primary" id="sendBtn" aria-label="发送">
                <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#send"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <dialog
    class="evidence-drawer"
    id="evidenceDrawer"
    aria-labelledby="evidenceDrawerTitle"
  >
    <header class="evidence-drawer-header">
      <div>
        <p class="evidence-drawer-eyebrow">引用证据</p>
        <h3 id="evidenceDrawerTitle">证据详情</h3>
        <p id="evidenceDrawerMeta" class="evidence-drawer-meta"></p>
      </div>
      <button class="btn btn-icon" id="evidenceDrawerClose" type="button" aria-label="关闭证据详情" autofocus>
        <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#x"/></svg>
      </button>
    </header>
    <div class="evidence-drawer-body" id="evidenceDrawerBody" aria-busy="false">
      <p class="evidence-drawer-status" id="evidenceDrawerStatus" role="status" aria-live="polite"></p>
      <article class="evidence-drawer-content" id="evidenceDrawerContent"></article>
    </div>
    <footer class="evidence-drawer-footer">
      <button class="btn btn-primary btn-sm" id="evidenceDrawerDownload" type="button" hidden>查看原文件</button>
    </footer>
  </dialog>
