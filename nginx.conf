# ============================================================
# SAR-Sense 项目 Nginx 配置文件
# 学习用途 - 每个指令都有中文注释
# ============================================================

# 全局配置
worker_processes  1;          # 工作进程数，CPU核心数或 auto

events {
    worker_connections  1024;  # 每个进程最大连接数
}

http {
    # ============================================================
    # 基础配置
    # ============================================================
    include       mime.types;                    # MIME 类型映射文件
    default_type  application/octet-stream;      # 默认 MIME 类型
    sendfile      on;                            # 开启高效文件传输
    keepalive_timeout  65;                       # 长连接超时时间(秒)

    # ============================================================
    # 日志格式定义
    # ============================================================
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  logs/access.log  main;          # 访问日志路径
    error_log   logs/error.log   error;         # 错误日志路径

    # ============================================================
    # 限流配置（面试常问）
    # ============================================================
    # 定义限流区域：按客户端 IP 限制，共享内存 10MB
    # rate=10r/s 表示每秒允许 10 个请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 定义连接数限制
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ============================================================
    # 后端服务器组（upstream）
    # ============================================================
    # upstream 用于负载均衡，可以配置多个后端
    upstream fastapi_backend {
        # 负载均衡策略（默认轮询）
        # least_conn;   # 最少连接数
        # ip_hash;      # IP 哈希（会话保持）

        server 127.0.0.1:5000;   # FastAPI 服务器

        # 可以添加多个服务器实现负载均衡
        # server 127.0.0.1:5001;
        # server 127.0.0.1:5002;
    }

    # ============================================================
    # 主服务器配置
    # ============================================================
    server {
        listen       80;                 # 监听端口
        server_name  localhost;          # 服务器名称（域名）

        # --------------------------------------------------------
        # 限流应用（在 server 块内）
        # --------------------------------------------------------
        # 每个 IP 最多 10 个并发连接
        limit_conn conn_limit 10;

        # --------------------------------------------------------
        # 静态文件 - CSS
        # --------------------------------------------------------
        location /css/ {
            alias  e:/agent开发trea/css/;    # alias 替换 location 路径
            expires 7d;                      # 缓存 7 天
            access_log off;                  # 静态文件不记录日志
        }

        # --------------------------------------------------------
        # 静态文件 - JS
        # --------------------------------------------------------
        location /js/ {
            alias  e:/agent开发trea/js/;
            expires 7d;
            access_log off;
        }

        # --------------------------------------------------------
        # 静态文件 - 图片资源
        # --------------------------------------------------------
        location /assets/ {
            alias  e:/agent开发trea/assets/;
            expires 30d;                     # 图片缓存 30 天
            access_log off;
        }

        # --------------------------------------------------------
        # HTML 页面
        # --------------------------------------------------------
        location ~* \.html$ {
            root  e:/agent开发trea;          # root 会保留 location 路径
            expires -1;                      # 不缓存 HTML
        }

        # --------------------------------------------------------
        # API 反向代理（核心配置）
        # --------------------------------------------------------
        location /api/ {
            # 应用限流：burst=20 允许突发 20 个请求，nodelay 不排队
            limit_req zone=api_limit burst=20 nodelay;

            # 反向代理到 FastAPI
            proxy_pass http://fastapi_backend;

            # 传递客户端真实信息（面试重点）
            proxy_set_header Host $host;                    # 原始 Host 头
            proxy_set_header X-Real-IP $remote_addr;        # 客户端真实 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 代理链 IP
            proxy_set_header X-Forwarded-Proto $scheme;     # 原始协议(http/https)

            # 超时设置
            proxy_connect_timeout 60s;      # 连接超时
            proxy_read_timeout 120s;        # 读取超时（SSE 长连接需要更长）
            proxy_send_timeout 60s;         # 发送超时

            # 缓冲设置
            proxy_buffering off;            # 关闭缓冲（SSE 流式响应需要）
        }

        # --------------------------------------------------------
        # SSE（Server-Sent Events）专用配置
        # --------------------------------------------------------
        location /api/chat/stream {
            proxy_pass http://fastapi_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 必须关闭缓冲
            proxy_buffering off;
            proxy_cache off;

            # 长连接超时（聊天流可能持续几分钟）
            proxy_read_timeout 300s;

            # 传递 chunked 编码
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # --------------------------------------------------------
        # 默认路由（兜底）
        # --------------------------------------------------------
        location / {
            root  e:/agent开发trea;
            index index.html login.html;    # 默认首页
            try_files $uri $uri/ /login.html;  # 文件不存在则返回 login.html
        }

        # --------------------------------------------------------
        # 错误页面
        # --------------------------------------------------------
        error_page  404              /404.html;
        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # ============================================================
    # HTTPS 配置（生产环境使用）
    # ============================================================
    # server {
    #     listen       443 ssl;
    #     server_name  your-domain.com;
    #
    #     ssl_certificate      /path/to/cert.pem;     # SSL 证书
    #     ssl_certificate_key  /path/to/key.pem;       # 私钥
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;               # SSL 协议版本
    #     ssl_ciphers HIGH:!aNULL:!MD5;                 # 加密套件
    #
    #     # 其他配置同上...
    # }
}